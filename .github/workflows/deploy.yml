name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via rsync over SSH
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          TARGET: ${{ secrets.REMOTE_TARGET }}
          ARGS: "-avzr --delete"
          # --delete removes anything on the server that is not in the repo,
          # so files that only exist on the server MUST be listed here.
          EXCLUDE: "/.git/, /.github/, /.gitignore, /.env, /.env.example, /uploads/, /.well-known/, /cgi-bin/, error_log, /.user.ini"
